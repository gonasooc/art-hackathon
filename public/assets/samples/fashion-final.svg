<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">접힌 파랑 — 패션 일러스트레이션 샘플</title>
  <desc id="desc">따뜻한 종이 위에 그린 길게 늘어진 인물과 비대칭 코발트 코트. 가슴을 가로지르는 커다란 접힘이 중심 모티프다. 시제품을 위해 새로 제작한 가상 작품.</desc>
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".095"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="19" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="1.65" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2451cc"/>
      <stop offset=".47" stop-color="#2449bc"/>
      <stop offset="1" stop-color="#163483"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7593e2"/><stop offset=".5" stop-color="#3a67d7"/><stop offset="1" stop-color="#284bb6"/>
    </linearGradient>
    <clipPath id="coatClip"><path d="M565 225 616 204 675 211 726 234 751 313 746 384 790 474 877 614 834 639 716 624 659 641 565 621 527 580 557 457 541 340Z"/></clipPath>
  </defs>
