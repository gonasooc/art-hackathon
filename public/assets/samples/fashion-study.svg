<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">접힌 파랑 — 드레이핑과 패턴 스터디 샘플</title>
  <desc id="desc">코발트 코트의 접힌 앞섶을 검토하는 패턴 스터디. 인물의 가봉선, 서로 어긋나는 수정선과 왼편 재단 패턴이 보인다. 시제품을 위해 새로 제작한 가상 작업 기록.</desc>
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".64" numOctaves="3" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><path d="M0 0V8" stroke="#5272bb" stroke-width=".6" opacity=".4"/></pattern>
