<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">공간 작품 샘플 — 전시 시안</title>
  <desc id="desc">어두운 전시 공간에 높이가 서로 다른 다섯 빛의 면이 떠 있고 바닥에 긴 빛의 흔적이 드리운 설치 작품의 가상 시안.</desc>
  <defs>
