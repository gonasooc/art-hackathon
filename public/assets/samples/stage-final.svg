    <linearGradient id="wall" x2="1" y2="1"><stop stop-color="#1c252a"/><stop offset=".6" stop-color="#333b38"/><stop offset="1" stop-color="#20282a"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#373c36"/><stop offset="1" stop-color="#151b1e"/></linearGradient>
    <linearGradient id="panel" x2="1" y2="0"><stop stop-color="#a38f6b"/><stop offset=".18" stop-color="#e9d7ac"/><stop offset=".57" stop-color="#fff1cc"/><stop offset=".9" stop-color="#ccb88d"/><stop offset="1" stop-color="#8a795e"/></linearGradient>
    <linearGradient id="beam" x2="0" y2="1"><stop stop-color="#efe1bc" stop-opacity=".25"/><stop offset="1" stop-color="#c6a577" stop-opacity="0"/></linearGradient>
    <linearGradient id="reflection" x2="0" y2="1"><stop stop-color="#dbc394" stop-opacity=".22"/><stop offset="1" stop-color="#b59c69" stop-opacity="0"/></linearGradient>
    <radialGradient id="pool"><stop stop-color="#f0d7a8" stop-opacity=".19"/><stop offset="1" stop-color="#e8c28c" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
